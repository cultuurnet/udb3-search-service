# The deployed shape of the service: php-fpm behind an nginx sidecar, with the AMQP
# consumers as separate containers. The acceptance-test pipeline uses this file on
# its own, against an image built from the Dockerfile's production target (see `make acc-test-build`)
#
# Local development adds docker-compose.override.yml, which Compose loads
# automatically. A plain `docker compose up` (or `make up`) builds the `dev` target
# instead and mounts your working tree over the code baked into it.
#
# SEARCH_IMAGE selects the image. The Makefile points it at a locally built tag; set
# it to an ECR tag ('acceptance', 'latest', a PIPELINE_VERSION) to run a published
# artifact instead.

x-search-service: &search-service
  image: ${SEARCH_IMAGE:-757200591793.dkr.ecr.eu-west-1.amazonaws.com/uitdatabank/search-api:latest}
  restart: unless-stopped
  environment:
    LOG_TO_STDOUT: "true"
  volumes:
    - ./config.php:/var/www/html/config.php:ro
    - ./public-keycloak.pem:/var/www/html/public-keycloak.pem:ro
    - ./api_keys_matched_to_client_ids.php:/var/www/html/api_keys_matched_to_client_ids.php:ro
    - ./default_queries.php:/var/www/html/default_queries.php:ro
    - ./facet_mapping_regions.php:/var/www/html/facet_mapping_regions.php:ro
    - ../geojson-data:/var/www/geojson-data:ro
  networks:
    - uitdatabank-search
  depends_on:
    elasticsearch:
      condition: service_healthy

services:
  search:
    <<: *search-service
    container_name: search.uitdatabank
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: search-nginx.uitdatabank
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FORWARD_HTTP_PORT:-8080}:80"
    networks:
      uitdatabank-search:
        aliases:
          - search.uitdatabank.local
    depends_on:
      search:
        condition: service_healthy

  search-consume-udb3-api:
    <<: *search-service
    command: ["php", "bin/app.php", "consume-udb3-api"]

  search-consume-udb3-cli:
    <<: *search-service
    command: ["php", "bin/app.php", "consume-udb3-cli"]

  search-consume-udb3-related:
    <<: *search-service
    command: ["php", "bin/app.php", "consume-udb3-related"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.12
    container_name: es8.uitdatabank
    hostname: 'udb3-es8'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    ports:
      - "${FORWARD_ES_PORT:-9200}:9200"
    volumes:
      - 'udb3-es8:/usr/share/elasticsearch/data'
    networks:
      uitdatabank-search:
        aliases:
          - elasticsearch8
          - elasticsearch8.uitdatabank.local
          - elasticsearch.uitdatabank.local
    healthcheck:
      test: 'curl -f http://127.0.0.1:9200/_cluster/health'
      start_period: 30s
      interval: 5s
      timeout: 4s
      retries: 10

networks:
  uitdatabank-search:
    name: uitdatabank
    external: true

volumes:
  udb3-es8:
    driver: local
